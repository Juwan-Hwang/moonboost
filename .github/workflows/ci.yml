name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }}
      - name: Node example against the JS build
        if: matrix.target == 'js'
        run: |
          moon build --target js --release
          node examples/node/iris.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: Public interface is up to date
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  prove:
    # Machine-checked proofs for the tree-walking kernel (see kernel/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Install Why3 and Z3
        run: sudo apt-get update && sudo apt-get install -y why3 z3
      - run: moon prove

  fixtures:
    # The differential-test fixtures must be reproducible from the reference
    # XGBoost release they claim to come from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install xgboost==3.4.1 scikit-learn numpy pandas
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate fixtures
        run: |
          python3 tools/gen_fixtures.py
          moon fmt
      - run: git diff --stat --exit-code xgboost_fixtures_test.mbt
